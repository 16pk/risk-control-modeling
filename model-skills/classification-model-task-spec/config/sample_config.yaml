# task-spec 样本拉取配置模板
# 复制为 sample_config.yaml 并填真实值。
# features 字段语义为"补充字段清单"(不直接入模)。
# 安全红线: 严禁在 where/任何字段硬编码用户ID/手机号/身份证号。
# 全仓库已废除 spark 取数, 仅支持 local_file 模式。

model:
  name: draw_willingness              # 取数任务名(用于落盘目录)
  version: v1
  mode: local_file
  local_parquet_path: /path/to/local_sample.parquet   # 本地样本文件(.parquet/.csv/.feather)
  sample_table: your_db.your_sample_table   # 仅记录用(本地文件模式不取数)
  dt_col: pday                        # 日期列(YYYY-MM-DD / YYYYMMDD 双兼容)
  id_cols: [user_no]                  # ID 列
  fetch_dt: ["20260410", "20260530"]  # 仅记录用, 本地样本无取数窗口概念
  where: null                         # 可选客群筛选, 如 "客群='活跃户'"

  # train/test/oot 时间划分: 仅「记录/透传」供用户确认需求规格, 不再驱动本地切分。
  # 切分与切分统计已后置到 feature-analysis, 切分区间单一真相 = feature_config.yaml 的 model.split。
  # 仍由 config_io.validate_split_ranges 校验记录区间的时序/格式合法性。
  split:
    train_range: ["20260410", "20260510"]
    test_range:  ["20260511", "20260520"]
    oot_range:   ["20260521", "20260530"]

  # 补充字段清单: 不直接入模, 供后续报告做补充分析
  # 留空 = 仅样本三列(id/label/dt)
  features: []
  feature_list_source: null

  # 标签字段二选一: label_col 直取, label_expr 表达式(本地文件模式 label_expr 仅记录)
  label_col: label                    # 样本中的标签列
  label_expr: null                    # 如 "(CASE WHEN req_cnt_t7>0 THEN 1 ELSE 0 END)"
